<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Norika &amp; Antoine | Wedding Invitation</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400&family=Fahkwang:wght@200;300&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
  <script>
    if (localStorage.getItem('wedding_auth') !== '1') {
      document.documentElement.style.visibility = 'hidden';
    }
  </script>
</head>
<body>

  <!-- NAV -->
  <nav class="nav" id="main-nav">
    <a class="nav__logo" href="#">N &amp; A</a>
    <div class="nav__links">
      <a class="nav__link" href="#wedding"          data-i18n="nav.program"></a>
      <a class="nav__link" href="#story"            data-i18n="nav.story"></a>
      <a class="nav__link" href="#getting-there"    data-i18n="nav.travel"></a>
      <a class="nav__link" href="things-to-do.html" data-i18n="nav.todo" data-lang-only="fr"></a>
      <a class="nav__link" href="#registry"         data-i18n="nav.registry"></a>
      <a class="nav__link" href="#more"             data-i18n="nav.faq"></a>
    </div>
    <div class="nav__right">
      <button class="nav__rsvp" data-rsvp-open data-i18n="rsvp.btn"></button>
      <button class="lang-toggle" id="main-lang-btn"></button>
      <button class="nav__hamburger" id="nav-hamburger" aria-label="Menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <!-- HAMBURGER MENU PANEL -->
  <div class="nav__menu" id="nav-menu" aria-hidden="true">
    <div class="nav__menu-inner">
      <a class="nav__menu-link" href="#wedding"          data-i18n="nav.program"></a>
      <a class="nav__menu-link" href="#story"            data-i18n="nav.story"></a>
      <a class="nav__menu-link" href="#getting-there"    data-i18n="nav.travel"></a>
      <a class="nav__menu-link" href="things-to-do.html" data-i18n="nav.todo" data-lang-only="fr"></a>
      <a class="nav__menu-link" href="#registry"         data-i18n="nav.registry"></a>
      <a class="nav__menu-link" href="#more"             data-i18n="nav.faq"></a>
      <button class="btn--round nav__menu-rsvp" data-rsvp-open data-i18n="rsvp.btn"></button>
    </div>
  </div>

  <!-- HERO -->
  <section class="hero">
    <div class="hero__left">
      <div class="hero__left-bg"></div>
      <div class="hero__content">
        <h1 class="hero__title">Norika &amp; Antoine</h1>
        <p class="hero__sub" data-i18n="hero.sub"></p>
        <p class="hero__date" data-i18n="hero.date"></p>
        <button class="btn--round btn--round-light" data-rsvp-open data-i18n="rsvp.btn"></button>
      </div>
    </div>
    <div class="hero__right">
      <img src="images/sf.jpg" alt="" />
    </div>
    <div class="hero__couple">
      <img src="images/japan.jpeg" alt="Norika and Antoine" />
    </div>
  </section>

  <!-- TAGLINE -->
  <section class="tagline">
    <p data-i18n="tagline"></p>
  </section>

  <!-- THE PROGRAM -->
  <section class="program" id="wedding">
    <div class="program__day">
      <div class="program__photo-wrap program__photo-wrap--left">
        <img src="images/marina_green.png" alt="Marina Green, San Francisco" class="program__photo" />
      </div>
      <span class="program__date" data-i18n="program.date1"></span>
      <h3 class="program__day-title" data-i18n="program.welcoming"></h3>
      <div class="program__events">
        <p class="program__event"><strong>Marina Green</strong>, San Francisco</p>
        <p class="program__event" data-i18n-html="program.drinks"></p>
        <p class="program__event program__event--note" data-i18n="program.layer"></p>
      </div>
    </div>

    <div class="program__day">
      <div class="program__photo-wrap program__photo-wrap--right">
        <img src="images/brazilian_room_house.jpeg" alt="Brazilian Room, Berkeley" class="program__photo" />
      </div>
      <span class="program__date" data-i18n="program.date2"></span>
      <h3 class="program__day-title" data-i18n="program.wedding"></h3>
      <div class="program__events">
        <p class="program__event"><strong>Brazilian Room</strong>, Berkeley</p>
        <p class="program__event" data-i18n-html="program.ceremony"></p>
        <p class="program__event" data-i18n-html="program.afterparty"></p>
      </div>
    </div>
  </section>

  <!-- LOVE STORY -->
  <section class="story" id="story">
    <div class="story__board">
      <div class="polaroid polaroid--1"><img src="images/disney.jpeg" alt="" /></div>
      <div class="polaroid polaroid--2"><img src="images/tiburon.jpeg" alt="" /></div>
      <div class="polaroid polaroid--3"><img src="images/zion.jpeg" alt="" /></div>
      <div class="polaroid polaroid--4"><img src="images/proposal.jpeg" alt="" /></div>
      <div class="polaroid polaroid--5"><img src="images/puerto.jpeg" alt="" /></div>
      <div class="polaroid polaroid--6"><img src="images/sequoia.jpeg" alt="" /></div>
      <div class="polaroid polaroid--7"><img src="images/cats.jpeg" alt="" /></div>
    </div>
  </section>

  <!-- GETTING THERE -->
  <section class="getting-there" id="getting-there">
    <h2 class="section-title" data-i18n="getting-there.title"></h2>
    <div class="getting-there__grid">
      <div class="getting-there__item">
        <h3 data-i18n="getting-there.air.title"></h3>
        <p data-i18n-html="getting-there.air.text"></p>
      </div>
      <div class="getting-there__divider"></div>
      <div class="getting-there__item">
        <h3 data-i18n="getting-there.lodging.title"></h3>
        <p data-i18n-html="getting-there.lodging.text"></p>
      </div>
    </div>
    <a href="#" class="btn--round" data-i18n="getting-there.btn"></a>
  </section>

  <!-- RSVP BANNER -->
  <section class="rsvp-banner" id="rsvp">
    <div class="rsvp-banner__content">
      <h2 data-i18n-html="rsvp.title"></h2>
      <p data-i18n="rsvp.text"></p>
      <p class="rsvp-banner__deadline" data-i18n="rsvp.deadline"></p>
      <button class="btn--round btn--round-light" data-rsvp-open data-i18n="rsvp.btn"></button>
    </div>
  </section>

  <!-- RSVP MODAL -->
  <div class="rsvp-modal" id="rsvp-modal" role="dialog" aria-modal="true" hidden>
    <div class="rsvp-modal__overlay" id="rsvp-modal-overlay"></div>
    <div class="rsvp-modal__panel">
      <button class="rsvp-modal__close" id="rsvp-modal-close" aria-label="Close">×</button>

      <!-- Update banner -->
      <div class="rsvp__update-banner" id="rsvp-update-banner" hidden>
        <span data-i18n="rsvp.form.update-banner"></span>
      </div>

      <!-- Success state -->
      <div class="rsvp__success" id="rsvp-success" hidden>
        <p class="rsvp__success-title" data-i18n="rsvp.form.success-title"></p>
        <p class="rsvp__success-text" data-i18n="rsvp.form.success-text"></p>
        <p class="rsvp__success-update" data-i18n="rsvp.form.success-update"></p>
      </div>

      <form id="rsvp-form" class="rsvp__form" novalidate>

        <!-- Name + Email -->
        <div class="rsvp__row">
          <input class="rsvp__input" type="text" id="rsvp-name" name="name" required
                 data-i18n-placeholder="rsvp.form.name" autocomplete="name" />
          <input class="rsvp__input" type="email" id="rsvp-email" name="email" required
                 data-i18n-placeholder="rsvp.form.email" autocomplete="email" />
        </div>

        <!-- Attending -->
        <fieldset class="rsvp__fieldset">
          <legend class="rsvp__legend" data-i18n="rsvp.form.attending"></legend>
          <div class="rsvp__radios">
            <label class="rsvp__radio">
              <input type="radio" name="attending" value="yes" />
              <span data-i18n="rsvp.form.yes"></span>
            </label>
            <label class="rsvp__radio">
              <input type="radio" name="attending" value="no" />
              <span data-i18n="rsvp.form.no"></span>
            </label>
          </div>
        </fieldset>

        <!-- Events + Guests -->
        <div id="rsvp-details" class="rsvp__details">
          <fieldset class="rsvp__fieldset">
            <legend class="rsvp__legend" data-i18n="rsvp.form.events"></legend>
            <div class="rsvp__checks">
              <label class="rsvp__check">
                <input type="checkbox" name="events" value="saturday" />
                <span data-i18n="rsvp.form.saturday"></span>
              </label>
              <label class="rsvp__check">
                <input type="checkbox" name="events" value="sunday" />
                <span data-i18n="rsvp.form.sunday"></span>
              </label>
            </div>
          </fieldset>

          <div class="rsvp__guests">
            <p class="rsvp__legend" data-i18n="rsvp.form.guests"></p>
            <div id="rsvp-guest-list"></div>
            <button type="button" class="rsvp__add-guest" id="rsvp-add-guest">
              <span aria-hidden="true">+</span>
              <span data-i18n="rsvp.form.add-guest"></span>
            </button>
          </div>
        </div>

        <!-- Message -->
        <textarea class="rsvp__input rsvp__textarea" name="message" id="rsvp-message"
                  rows="3" data-i18n-placeholder="rsvp.form.message"></textarea>

        <!-- Error -->
        <p class="rsvp__error" id="rsvp-error"></p>

        <!-- Submit -->
        <div class="rsvp__submit-wrap">
          <button type="submit" class="rsvp__submit" id="rsvp-submit">
            <span data-i18n="rsvp.form.submit"></span>
          </button>
        </div>

      </form>
    </div>
  </div>

  <!-- REGISTRY -->
  <section class="registry" id="registry">
    <div class="registry__inner">
      <h2 class="section-title" data-i18n="registry.title"></h2>
      <p class="registry__text" data-i18n="registry.text"></p>

      <div class="registry__card">
        <div class="registry__contribute">
          <p class="registry__step" data-i18n="registry.step.pay"></p>
          <p class="registry__step-hint" data-i18n="registry.step.pay-hint"></p>
          <div class="registry__pay-options">
            <!-- TODO: replace VENMO_USERNAME with your Venmo @username -->
            <a class="registry__method" href="https://venmo.com/u/VENMO_USERNAME" target="_blank" rel="noopener">
              <span data-i18n="registry.venmo"></span>
            </a>
            <!-- TODO: save your Venmo QR code as images/venmo-qr.png -->
            <div class="registry__qr">
              <img src="images/venmo-qr.png" alt="Venmo QR code" class="registry__qr-img" />
              <p class="registry__qr-caption" data-i18n="registry.qr.caption"></p>
            </div>
          </div>
        </div>

        <div class="registry__message">
          <p class="registry__step" data-i18n="registry.step.message"></p>
          <form class="registry__form" id="registry-form" novalidate>
            <input class="rsvp__input" type="text" name="name" id="registry-name" required
                   data-i18n-placeholder="registry.note.name" autocomplete="name" />
            <textarea class="rsvp__input rsvp__textarea" name="message" id="registry-message"
                      rows="3" data-i18n-placeholder="registry.note.message"></textarea>
            <p class="rsvp__error" id="registry-error"></p>
            <div class="rsvp__submit-wrap">
              <button type="submit" class="rsvp__submit" id="registry-submit">
                <span data-i18n="registry.note.submit"></span>
              </button>
            </div>
          </form>
          <p class="registry__note-success" id="registry-success" hidden data-i18n="registry.note.success"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- QUESTIONS -->
  <section class="questions" id="more">
    <h2 class="section-title" data-i18n="questions.title"></h2>

    <!-- FAQ -->
    <div class="faq">
      <div class="faq__item">
        <h3 class="faq__q" data-i18n="faq.1.q"></h3>
        <p class="faq__a" data-i18n="faq.1.a"></p>
      </div>
      <div class="faq__item">
        <h3 class="faq__q" data-i18n="faq.2.q"></h3>
        <p class="faq__a" data-i18n="faq.2.a"></p>
      </div>
      <div class="faq__item">
        <h3 class="faq__q" data-i18n="faq.3.q"></h3>
        <p class="faq__a" data-i18n="faq.3.a"></p>
      </div>
      <div class="faq__item">
        <h3 class="faq__q" data-i18n="faq.4.q"></h3>
        <p class="faq__a" data-i18n="faq.4.a"></p>
      </div>
      <div class="faq__item">
        <h3 class="faq__q" data-i18n="faq.5.q"></h3>
        <p class="faq__a" data-i18n="faq.5.a"></p>
      </div>
      <div class="faq__item">
        <h3 class="faq__q" data-i18n="faq.6.q"></h3>
        <p class="faq__a" data-i18n="faq.6.a"></p>
      </div>
      <div class="faq__item">
        <h3 class="faq__q" data-i18n="faq.7.q"></h3>
        <p class="faq__a" data-i18n-html="faq.7.a"></p>
      </div>
    </div>

    <p class="questions__sub" data-i18n="questions.sub"></p>
    <div class="questions__contacts">
      <div class="questions__contact">
        <span class="name">Antoine &amp; Norika:</span>
        <span class="phone">antoine&nbsp;[at]&nbsp;riviere&nbsp;[dot]&nbsp;tf</span>
      </div>
    </div>
  </section>

  <!-- PASSWORD GATE -->
  <div id="gate" class="gate" style="display:none">
    <div class="gate__box">
      <!-- LANGUAGE SWITCHER (gate page) -->
      <div class="lang-switcher lang-switcher--gate">
        <button class="lang-toggle" id="gate-lang-btn"></button>
      </div>
      <h2 class="gate__title">Norika &amp; Antoine</h2>
      <p class="gate__sub" data-i18n="gate.sub"></p>
      <form class="gate__form" id="gate-form">
        <div class="gate__field">
          <input class="gate__input" id="gate-input" type="text" data-i18n-placeholder="gate.placeholder" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" />
          <span class="gate__hint" tabindex="0">?</span>
        </div>
        <button class="gate__btn" type="submit" data-i18n="gate.btn"></button>
      </form>
      <p class="gate__error" id="gate-error"></p>
    </div>
  </div>

  <script src="translations.js"></script>
  <script src="app.js"></script>
  <script src="rsvp.js"></script>
</body>
</html>
